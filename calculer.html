<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Simulateur de rentabilité – Atelier CAL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root{
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.75);
      --line: rgba(255,255,255,0.18);
      --card: rgba(255,255,255,0.04);
      --accent: #c9a24d;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #1c1c1c 0%, #0b0b0b 45%, #000 100%);
    }

    .container{
      width: min(1120px, 92vw);
      margin: 0 auto;
      padding: 26px 0 60px;
    }

    .btn{
      display:inline-flex;
      padding:12px 14px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      text-decoration:none;
      font-weight:700;
    }

    h1{ margin:14px 0 8px; }

    .panel{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .row > div{ flex:1 1 220px; }

    label{
      display:block;
      margin-bottom:6px;
      font-weight:700;
      color: var(--muted);
    }

    input, select{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.16);
      background: rgba(0,0,0,0.35);
      color: var(--text);
    }

    .grid{
      display:grid;
      grid-template-columns: 1.3fr 1fr 1fr 1fr;
      gap:10px;
      margin-top:14px;
    }

    .head{ font-weight:700; color:var(--muted); }
    .label{ font-weight:700; }

    .actions{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:14px;
      gap:10px;
      flex-wrap:wrap;
    }

    .kpis{
      display:grid;
      grid-template-columns: repeat(3,1fr);
      gap:10px;
      margin-top:14px;
    }

    .kpi{
      background: rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:14px;
      padding:14px;
    }

    .kpi-title{ color:var(--muted); font-weight:700; }
    .kpi-val{ font-size:1.25rem; font-weight:900; }

    .summary-line{
      margin: 10px 0 12px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px dashed rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.04);
      font-weight: 900;
    }

    .chart-wrap{
      height:360px;
      margin-top:10px;
      padding:12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.25);
    }
    #roiChart{ width:100%; height:100%; }

    @media(max-width:860px){
      .grid{ grid-template-columns:1fr; }
      .head{ display:none; }
      .kpis{ grid-template-columns:1fr; }
      .chart-wrap{ height:420px; }
    }
  </style>
</head>

<body>
<div class="container">

<a class="btn" href="index.html">← Retour</a>

<h1>Calculer la rentabilité</h1>

<div class="panel">

<div class="row">
  <div>
    <label>Poids du paquet</label>
    <select id="packSize">
      <option value="200">200 g</option>
      <option value="250" selected>250 g</option>
    </select>
  </div>
  <div>
    <label>Prix machine (€)</label>
    <input id="machinePrice" value="3260">
  </div>
</div>

<div class="grid">
  <div></div><div class="head">Paquets/mois</div><div class="head">Prix €/kg</div><div class="head">Marge %</div>

  <div class="label">Bonbon sucre cuit</div>
  <input id="qtySugar" value="120">
  <input id="priceSugar" value="21.30">
  <input id="marginSugar" value="50">

  <div class="label">Bonbon au miel</div>
  <input id="qtyHoney" value="80">
  <input id="priceHoney" value="28.90">
  <input id="marginHoney" value="55">

  <div class="label">Nougatine</div>
  <input id="qtyNoug" value="40">
  <input id="priceNoug" value="55.00">
  <input id="marginNoug" value="45">
</div>

<div class="actions">
  <label><input type="checkbox" id="live" checked> Calcul en direct</label>
  <button class="btn" id="btnCalc">Calculer</button>
</div>

<div class="kpis">
  <div class="kpi"><div class="kpi-title">CA / mois</div><div class="kpi-val" id="kpiCA">—</div></div>
  <div class="kpi"><div class="kpi-title">Marge / mois</div><div class="kpi-val" id="kpiMargin">—</div></div>
  <div class="kpi"><div class="kpi-title">Amortissement</div><div class="kpi-val" id="kpiPayback">—</div></div>
</div>

<div id="summaryLine" class="summary-line">—</div>

<div class="chart-wrap">
  <canvas id="roiChart"></canvas>
</div>

</div>
</div>

<script>
let chart;

function euro(n){ return n.toLocaleString("fr-FR",{style:"currency",currency:"EUR"}); }
function v(id){ return parseFloat(document.getElementById(id).value)||0; }

function compute(){
  const packKg = v("packSize")/1000;
  const machine = v("machinePrice");

  const items = [
    [v("qtySugar"), v("priceSugar"), v("marginSugar")],
    [v("qtyHoney"), v("priceHoney"), v("marginHoney")],
    [v("qtyNoug"),  v("priceNoug"),  v("marginNoug")]
  ];

  let ca=0, marge=0, packs=0;
  items.forEach(i=>{
    const c = i[0]*packKg*i[1];
    ca+=c; marge+=c*(i[2]/100); packs+=i[0];
  });

  document.getElementById("kpiCA").textContent = euro(ca);
  document.getElementById("kpiMargin").textContent = euro(marge);

  const pay = marge>0 ? (machine/marge).toFixed(1)+" mois" : "—";
  document.getElementById("kpiPayback").textContent = pay;

  document.getElementById("summaryLine").textContent =
    `Production : ${(packs*packKg).toFixed(1)} kg/mois — machine amortie en ~${pay}`;

  const labels=[], mc=[], inv=[];
  let cum=0;
  for(let i=1;i<=24;i++){
    cum+=marge; labels.push("M"+i); mc.push(cum); inv.push(machine);
  }

  if(chart) chart.destroy();
  chart = new Chart(roiChart,{
    type:"line",
    data:{labels,datasets:[
      {label:"Marge cumulée",data:mc,borderWidth:2},
      {label:"Investissement machine",data:inv,borderWidth:2,borderDash:[6,6]}
    ]},
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{legend:{position:"bottom"}},
      scales:{y:{ticks:{callback:v=>v+" €"}}}
    }
  });
}

["packSize","machinePrice","qtySugar","priceSugar","marginSugar","qtyHoney","priceHoney","marginHoney","qtyNoug","priceNoug","marginNoug"]
.forEach(id=>document.getElementById(id).addEventListener("input",()=>document.getElementById("live").checked&&compute()));

document.getElementById("btnCalc").onclick=compute;
compute();
</script>

</body>
</html>
