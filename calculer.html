<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Simulateur de rentabilité – Atelier CAL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Simulateur de rentabilité Atelier CAL : estimez le chiffre d'affaires, la marge et la durée d'amortissement de la machine SRC selon votre production mensuelle." />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root{
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.75);
      --line: rgba(255,255,255,0.18);
      --card: rgba(255,255,255,0.04);
      --accent: #c9a24d;
      --bg1: #1c1c1c;
      --bg2: #0b0b0b;
      --bg3: #000;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
    }

    .container{
      width: min(1120px, 92vw);
      margin: 0 auto;
      padding: 26px 0 60px;
    }

    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom: 16px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      text-decoration:none;
      font-weight: 700;
      white-space:nowrap;
    }
    .btn:hover{ background: rgba(255,255,255,0.10); }
    .btn-accent{
      border-color: rgba(201,162,77,0.45);
      background: rgba(201,162,77,0.10);
    }
    .btn-accent:hover{ background: rgba(201,162,77,0.16); }

    h1{
      margin: 10px 0 10px;
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      letter-spacing: 0.2px;
    }
    .subtitle{
      color: var(--muted);
      line-height: 1.6;
      margin: 0 0 18px;
      max-width: 900px;
    }

    .panel{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
    }

    .grid{
      display:grid;
      grid-template-columns: 1.2fr 1fr 1fr 1fr;
      gap: 10px;
      align-items:center;
      margin-top: 12px;
    }

    .head{
      color: rgba(255,255,255,0.78);
      font-weight: 700;
      font-size: 0.92rem;
      padding: 6px 0;
    }

    .label{
      color: rgba(255,255,255,0.9);
      font-weight: 700;
    }

    input, select{
      width: 100%;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(0,0,0,0.35);
      color: var(--text);
      outline: none;
    }
    input:focus, select:focus{
      border-color: rgba(201,162,77,0.55);
      box-shadow: 0 0 0 3px rgba(201,162,77,0.12);
    }

    .row{
      display:flex;
      flex-wrap:wrap;
      gap: 10px;
      margin-top: 12px;
    }
    .row > div{
      flex: 1 1 220px;
