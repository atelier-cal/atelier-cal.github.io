<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogue Atelier CAL</title>

  <!-- Google Analytics GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-K4502PGZ0X"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-K4502PGZ0X');
  </script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fffaf0, #f3e3c0);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 25px;
      box-sizing: border-box;
    }

    .box {
      max-width: 720px;
      width: 100%;
      background: white;
      padding: 40px 25px;
      border-radius: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.18);
    }

    h1 {
      font-size: clamp(30px, 6vw, 56px);
      margin: 0 0 15px;
      color: #2b1b0f;
    }

    p {
      font-size: clamp(17px, 3vw, 24px);
      color: #5b4a35;
      margin-bottom: 30px;
      line-height: 1.4;
    }

    .btn-download {
      display: block;
      width: 100%;
      max-width: 480px;
      margin: 0 auto 15px;
      padding: 22px 26px;
      background: linear-gradient(135deg, #b8873b, #d4af37);
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 14px;
      font-size: clamp(20px, 4vw, 28px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      box-sizing: border-box;
      transition: 0.3s;
    }

    .btn-download:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }

    .info {
      margin-top: 25px;
      font-size: 16px;
      color: #7a6a55;
    }
  </style>
  <link rel="stylesheet" href="/assets/premium-pages.css">

  <div class="box">

      les tarifs et les informations principales.
    </p>

    <!-- Bouton PDF avec suivi GA4 -->
    <a class="btn-download"
       href="/pdf/catalogue-atelier-cal.pdf"
       target="_blank"
       onclick="gtag('event', 'telechargement_catalogue', {
         'event_category': 'Catalogue',
         'event_label': 'catalogue-atelier-cal.pdf',
         'file_name': 'catalogue-atelier-cal.pdf',
         'file_url': '/pdf/catalogue-atelier-cal.pdf'
       });">
      📄 Télécharger le catalogue PDF
    </a>

    <div class="info">
      TVA à 0 % — article 293 B du CGI
