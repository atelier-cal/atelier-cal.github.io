    header{

      background: linear-gradient(180deg, rgba(5,6,10,.92), rgba(5,6,10,.58));

      gap:12px;
      min-width: 280px;
    }

    .brand-logo{

      object-fit: contain;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,.46));

    }

      letter-spacing: .35px;

    .brand-text span{

      margin-top: 2px;
      letter-spacing: .22px;
    }

    .actions{

      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .btn{
      display:inline-flex;
      align-items:center;

      white-space:nowrap;
      cursor:pointer;

    .btn:hover{

      background: rgba(255,255,255,.06);
      box-shadow: 0 14px 34px rgba(0,0,0,.38);
    }
    .btn.primary{

      background: linear-gradient(135deg, rgba(255,181,90,.20), rgba(255,122,24,.14));
      box-shadow:

        0 0 0 1px rgba(255,181,90,.10) inset,
        0 18px 46px rgba(255,181,90,.08);
    }
    .btn:focus-visible{
      outline: 2px solid rgba(255,181,90,.55);
      outline-offset: 2px;
    }
    .btn[disabled]{
      opacity:.65;
      cursor:not-allowed;
    }

    }
