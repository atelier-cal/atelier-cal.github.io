<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Atelier CAL – Modèles disponibles</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- viewer 3D (model-viewer) -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    :root{
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.75);
      --line: rgba(255,255,255,0.18);
      --line2: rgba(255,255,255,0.28);
      --card: rgba(255,255,255,0.04);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #1c1c1c 0%, #0b0b0b 45%, #000 100%);
    }

    .container{
      width: min(1120px, 92vw);
      margin: 0 auto;
    }

    header{
      padding: 60px 0 18px;
      text-align:center;
    }

    h1{
      margin:0 0 10px;
      font-size: clamp(2rem, 3.4vw, 2.8rem);
      letter-spacing: .5px;
    }

    .subtitle{
      margin: 0 auto;
      max-width: 900px;
      line-height: 1.6;
      font-size: 1.02rem;
      color: var(--muted);
    }

    .top-actions{
      margin-top: 18px;
      display:flex;
      gap: 12px;
      justify-content:center;
      flex-wrap: wrap;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 14px 22px;
      border: 1px solid var(--line2);
      color:#fff;
      text-decoration:none;
      font-size: .95rem;
      letter-spacing: .8px;
      text-transform: uppercase;
      background: transparent;
      transition: all .25s ease;
    }
    .btn:hover{
      background:#fff;
      color:#000;
      box-shadow: 0 0 20px rgba(255,255,255,0.2);
      transform: translateY(-1px);
    }

    main{
      padding: 30px 0 50px;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--line);
      padding: 14px;
    }

    .img{
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #000;
      border: 1px solid rgba(255,255,255,0.14);
      display: block;
      object-fit: contain;
    }

    .title{
      margin: 12px 0 6px;
      font-size: 1.05rem;
      letter-spacing: .2px;
    }

    .desc{
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: .95rem;
    }

    .tag{
      margin-top: 10px;
      display:inline-block;
      padding: 6px 10px;
      border: 1px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.8);
      font-size: .8rem;
      letter-spacing: .6px;
      text-transform: uppercase;
    }

    .contact{
      margin-top: 26px;
      padding: 18px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      text-align:center;
      color: var(--muted);
    }
    .contact a{
      color: rgba(255,255,255,0.92);
      text-decoration:none;
      border-bottom: 1px dotted rgba(255,255,255,0.25);
    }
    .contact a:hover{
      border-bottom-color: rgba(255,255,255,0.55);
    }

    footer{
      padding: 28px 0 38px;
      text-align:center;
      font-size: .9rem;
      color: rgba(255,255,255,0.55);
    }

    @media (max-width: 920px){
      .grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px){
      header{ padding-top: 50px; }
      .grid{ grid-template-columns: 1fr; }
    }

    /* ===== MODAL 3D (ajout minimal) ===== */
    .viewer3d-overlay{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 14px;
    }

    .viewer3d-box{
      width: min(980px, 100%);
      height: min(640px, 82vh);
      background: #000;
      border: 1px solid rgba(255,255,255,0.2);
      position: relative;
      overflow: hidden;
    }

    .viewer3d-close{
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      font-size: 18px;
      padding: 6px 10px;
      cursor: pointer;
      z-index: 2;
    }
    .viewer3d-close:hover{
      background:#fff;
      color:#000;
    }

    .img-clickable{ cursor: pointer; }
  </style>
</head>

<body>

    <div class="container">
      <h1>Modèles disponibles</h1>
      <p class="subtitle"></p>

      <div class="top-actions">
        <a class="btn" href="index.html">Retour</a>
        <a class="btn" href="#contact">Demander un devis</a>
      </div>
    </div>
  </header>

          <div class="title">Pastille</div>
          <p class="desc">Format standard, parfait pour séries.</p>
          <span class="tag">Standard</span>
        </div>
