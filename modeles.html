<style>
/* ==== STYLE EXISTANT (INCHANGÉ) ==== */
:root{
  --text: rgba(255,255,255,0.92);
  --muted: rgba(255,255,255,0.75);
  --line: rgba(255,255,255,0.18);
  --card: rgba(255,255,255,0.04);
}

body{
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  background: radial-gradient(circle at top, #1c1c1c 0%, #0b0b0b 45%, #000 100%);
}

.container{width:min(1120px,92vw);margin:auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);padding:14px}
.img{width:100%;aspect-ratio:1/1;background:#000;object-fit:contain}
.title{margin:12px 0 6px;font-size:1.05rem}
.desc{margin:0;color:var(--muted);font-size:.95rem}

.tag-row{
  margin-top:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.tag{
  padding:6px 10px;
  border:1px solid rgba(255,255,255,.18);
  font-size:.8rem;
  text-transform:uppercase;
}

/* ==== NOUVEAU : ICÔNES RONDES CONTACT ==== */
.contact-icons{
  display:flex;
  gap:10px;
}

.contact-icon{
  width:36px;
  height:36px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.7);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.2s;
  text-decoration:none;
}

.contact-icon:hover{
  background:rgba(255,255,255,.12);
  transform:translateY(-1px);
}

.contact-icon svg{
  width:18px;
  height:18px;
  stroke:#fff;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:560px){
  .grid{grid-template-columns:1fr}
}
</style>

<body>

<main>
<div class="container">
<div class="grid">

<!-- ==== EXEMPLE CARD (PASTILLE) ==== -->
<div class="card">
  <img class="img" src="modele-pastille.png" alt="Pastille">
  <div class="title">Pastille</div>
  <p class="desc">Format standard, passe partout.</p>

  <div class="tag-row">
    <span class="tag">Standard</span>

    <div class="contact-icons">
      <!-- SMS -->
      <a class="contact-icon"
         href="sms:+33677845435?&body=Bonjour%20Stevens%2C%20je%20souhaite%20un%20devis%20pour%20le%20b%C3%A2ti%20SRC%20(mod%C3%A8le%20Pastille)">
        <svg viewBox="0 0 24 24">
          <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>
        </svg>
      </a>

      <!-- TEL -->
      <a class="contact-icon" href="tel:+33677845435">
        <svg viewBox="0 0 24 24">
          <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7"/>
        </svg>
      </a>
    </div>
  </div>
</div>

<!-- 👉 DUPLIQUE EXACTEMENT CE BLOC POUR CHAQUE MODÈLE -->
<!-- juste change le texte du SMS (Pastille, Abeille, etc.) -->

</div>
</div>
</main>
