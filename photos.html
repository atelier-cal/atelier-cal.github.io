<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Photos – Atelier CAL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root{
      --bg1:#070707;
      --bg2:#141414;
      --line:rgba(255,255,255,0.16);
      --text:rgba(255,255,255,0.92);
      --muted:rgba(255,255,255,0.7);
      --accent:#c9a24d;
      --shadow: 0 26px 90px rgba(0,0,0,.70);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 50% -20%, rgba(201,162,77,.10), transparent 60%),
        radial-gradient(circle at top, var(--bg2), var(--bg1));
    }

    header{
      text-align:center;
      padding:52px 20px 26px;
    }

    h1{
      margin:0 0 10px;
      font-size:clamp(2.0rem, 4vw, 3.1rem);
    }

    .subtitle{
      max-width:920px;
      margin:0 auto;
      color:var(--muted);
      line-height:1.6;
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:0 18px 80px;
    }

    /* Bloc cinéma */
    .shot{
      margin: 28px auto;
      border:1px solid var(--line);
      background:rgba(255,255,255,0.03);
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
    }

    .shot::before{
      content:"";
      position:absolute;
      inset:-140px -140px auto -140px;
      height:240px;
      background: radial-gradient(circle at 50% 40%, rgba(201,162,77,.18), transparent 62%);
      pointer-events:none;
      filter: blur(6px);
    }

    .media{
      padding:14px;
      background: rgba(0,0,0,0.25);
    }

    @media (max-width:768px){
      .media{ padding:10px; }
    }

    .shot img,
    .shot video{
      width:100%;
      display:block;
      background:#000;
    }

    /* Apparition au scroll */
    .reveal{
      opacity:0;
      transform: translateY(22px) scale(0.985);
      filter: blur(1px);
      transition:
        opacity .70s ease,
        transform .70s ease,
        filter .70s ease;
    }

    .reveal.is-visible{
      opacity:1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }

    /* Survol PC léger */
    @media (hover:hover){
      .shot img{
        transition: transform .25s ease, filter .25s ease;
      }
      .shot:hover img{
        transform: scale(1.01);
        filter: contrast(1.02) saturate(1.02);
      }
    }

    .back{
      text-align:center;
      margin-top:34px;
    }

    .back a{
      color:var(--accent);
      text-decoration:none;
      font-size:.95rem;
    }
    .back a:hover{ text-decoration:underline; }
  </style>
</head>

<body>

<header>
  <h1>Galerie photos</h1>
  <p class="subtitle">
    Machine Atelier CAL – photos réelles, détails mécaniques, rouleaux et finitions.
  </p>
</header>

<div class="wrap">

  <!-- VIDEO -->
  <section class="shot reveal">
    <div class="media">
      <video controls playsinline preload="metadata">
        <source src="photos/video01.mp4" type="video/mp4">
        Votre navigateur ne supporte pas la vidéo.
      </video>
    </div>
  </section>

  <!-- MACHINE COMPLETE -->
  <section class="shot reveal">
    <div class="media">
      <img src="photos/photo03.JPG" alt="Machine Atelier CAL">
    </div>
  </section>

  <!-- DETAILS MECANIQUES -->
  <section class="shot reveal">
    <div class="media">
      <img src="photos/photo04.JPG" alt="Détails mécaniques">
    </div>
  </section>

  <!-- SECURITE / ARRET URGENCE -->
  <section class="shot reveal">
    <div class="media">
      <img src="photos/photo02.JPG" alt="Sécurité et arrêt d’urgence">
    </div>
  </section>

  <!-- PROTECTION / FINITION -->
  <section class="shot reveal">
    <div class="media">
      <img src="photos/photo05.JPG" alt="Protection et finition">
    </div>
  </section>

  <!-- ROULEAUX BRONZE -->
  <section class="shot reveal">
    <div class="media">
      <img src="photos/photo01.JPG" alt="Rouleaux en bronze poli">
    </div>
  </section>

  <div class="back">
    <a href="index.html">← Retour à l’accueil</a>
  </div>

</div>

<script>
  const items = document.querySelectorAll('.reveal');

  const io = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.classList.add('is-visible');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.18 });

  items.forEach(el => io.observe(el));
</script>

</body>
</html>
