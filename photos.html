<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Photos – Atelier CAL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root{
      --bg1:#070707;
      --bg2:#141414;
      --card:rgba(255,255,255,0.04);
      --line:rgba(255,255,255,0.16);
      --text:rgba(255,255,255,0.92);
      --muted:rgba(255,255,255,0.7);
      --accent:#c9a24d;
      --shadow: 0 24px 80px rgba(0,0,0,.65);
    }
    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 50% -20%, rgba(201,162,77,.10), transparent 60%),
        radial-gradient(circle at top, var(--bg2), var(--bg1));
    }

    /* ====== HERO VIDEO CINÉMA ====== */
    .hero{
      width:100%;
      padding:34px 18px 18px;
    }

    .hero-inner{
      max-width:1200px;
      margin:0 auto;
    }

    .hero-title{
      text-align:center;
      padding:10px 0 16px;
    }

    .hero-title h1{
      margin:0 0 10px;
      font-size:clamp(2.0rem, 4vw, 3.1rem);
      letter-spacing:.25px;
    }

    .hero-title p{
      margin:0 auto;
      max-width:920px;
      color:var(--muted);
      line-height:1.6;
    }

    .video-frame{
      margin:18px auto 0;
      border:1px solid var(--line);
      background:rgba(0,0,0,.35);
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
    }

    /* petite “lueur” premium */
    .video-frame::before{
      content:"";
      position:absolute;
      inset:-120px -120px auto -120px;
      height:220px;
      background: radial-gradient(circle at 50% 40%, rgba(201,162,77,.20), transparent 60%);
      pointer-events:none;
      filter: blur(6px);
    }

    .video-frame video{
      width:100%;
      display:block;
      background:#000;
      aspect-ratio: 21/9; /* cinéma */
    }

    /* Sur mobile, 21/9 peut être trop plat -> on passe en 16/9 */
    @media (max-width: 768px){
      .video-frame video{ aspect-ratio:16/9; }
    }

    /* ====== SECTION CAROUSEL ====== */
    .section{
      max-width:1200px;
      margin:26px auto 80px;
      padding:0 18px;
    }

    .bar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin:0 0 12px;
    }

    .bar-left{
      display:flex;
      flex-direction:column;
      gap:4px;
    }

    .bar-title{
      font-weight:800;
      letter-spacing:.25px;
      color:rgba(255,255,255,0.88);
    }

    .bar-hint{
      font-size:.92rem;
      color:var(--muted);
    }

    .bar-right{
      display:flex;
      gap:10px;
      align-items:center;
    }

    .navbtn{
      appearance:none;
      border:1px solid rgba(255,255,255,0.25);
