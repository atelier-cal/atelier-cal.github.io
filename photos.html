<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Photos – Atelier CAL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root{
      --bg1:#0b0b0b;
      --bg2:#151515;
      --card:rgba(255,255,255,0.04);
      --line:rgba(255,255,255,0.16);
      --text:rgba(255,255,255,0.92);
      --muted:rgba(255,255,255,0.7);
      --accent:#c9a24d;
    }

    *{ box-sizing:border-box }

    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      color: var(--text);
    }

    header{
      text-align:center;
      padding:50px 20px 30px;
    }

    h1{
      font-size:clamp(2rem,4vw,3rem);
      margin:0 0 10px;
    }

    .subtitle{
      max-width:900px;
      margin:0 auto;
      color:var(--muted);
      line-height:1.6;
    }

    .gallery{
      max-width:1200px;
      margin:40px auto 80px;
      padding:0 20px;
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(260px,1fr));
      gap:22px;
    }

    .photo-card{
      border:1px solid var(--line);
      background:var(--card);
      overflow:hidden;
      transition:.25s;
    }

    .photo-card:hover{
      transform:translateY(-4px);
      border-color:var(--accent);
    }

    .photo-card img,
    .photo-card video{
      width:100%;
      display:block;
      background:#000;
    }

    .photo-card img{
      cursor:zoom-in;
    }

    .caption{
      padding:12px 14px;
      font-size:.9rem;
      color:var(--muted);
      text-align:center;
      border-top:1px solid rgba(255,255,255,0.08);
    }

    .back{
      text-align:center;
      margin-bottom:60px;
    }

    .back a{
      color:var(--accent);
      text-decoration:none;
      font-size:.95rem;
    }

    .back a:hover{
      text-decoration:underline;
    }
  </style>
</head>

<body>

<header>
  <h1>Galerie photos</h1>
  <p class="subtitle">
    Machine Atelier CAL – photos réelles, détails mécaniques, rouleaux et finitions.
  </p>
</header>

<section class="gallery">

  <!-- VIDEO -->
  <div class="photo-card">
    <video controls playsinline preload="metadata">
      <source src="photos/video01.mp4" type="video/mp4">
      Votre navigateur ne supporte pas la vidéo.
    </video>
    <div class="caption">Vidéo – machine en fonctionnement</div>
  </div>

  <!-- PHOTOS -->
  <div class="photo-card">
    <img src="photos/photo01.jpeg" alt="Atelier CAL – photo 01">
    <div class="caption">Vue générale de la machine</div>
  </div>

  <div class="photo-card">
    <img src="photos/photo02.jpeg" alt="Atelier CAL – photo 02">
    <div class="caption">Vue latérale du bâti</div>
  </div>

  <div class="photo-card">
    <img src="photos/photo03.jpeg" alt="Atelier CAL – photo 03">
    <div class="caption">Détails mécaniques</div>
  </div>

  <div class="photo-card">
    <img src="photos/photo04.jpeg" alt="Atelier CAL – photo 04">
    <div class="caption">Rouleaux en bronze poli</div>
  </div>

  <div class="photo-card">
    <img src="photos/photo05.jpeg" alt="Atelier CAL – photo 05">
    <div class="caption">Finitions et conception</div>
  </div>

</section>

<div class="back">
  <a href="index.html">← Retour à l’accueil</a>
</div>

</body>
</html>
