  <meta name="keywords" content="machine confiserie, machine bonbon, bâti à cylindres, machine nougatine, machine bonbon miel, confiseur professionnel" />

  <style>
    :root{
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.75);
      --line: rgba(255,255,255,0.18);
      --line2: rgba(255,255,255,0.28);
      --card: rgba(255,255,255,0.04);
      --accent: #c9a24d;
      --bg1: #1c1c1c;
      --bg2: #0b0b0b;
      --bg3: #000;
    }

    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
    }

    /* ===================== BANNIÈRE (défilement + bonbons) ===================== */
    .top-banner{
      position: relative;
      height: 46px;
      background: #0f1115;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      overflow: hidden;
    }

    /* un seul "rail" qui défile : texte + bonbons ensemble */
    .banner-track{
      height: 46px;
      display: inline-flex;
      align-items: center;
      gap: 18px;
      padding-left: 100%;
      white-space: nowrap;
      will-change: transform;
      animation: bannerScroll 18s linear infinite;
    }

    @keyframes bannerScroll{
      0%   { transform: translate3d(0,0,0); }
      100% { transform: translate3d(-50%,0,0); }
    }

    /* texte */
    .banner-text{
      color: var(--accent);
      font-size: 14px;
      letter-spacing: 0.2px;
    }

    /* bonbons DANS le rail */
    .banner-candy{
      width: 50px;                 /* +80% (28px -> ~50px) */
      height: 50px;
      margin-top: -2px;            /* petit ajustement vertical */
      flex: 0 0 auto;
      pointer-events: none;
      opacity: 1;                  /* pas d’opacité */
      animation: spin 8s linear infinite;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.45));
    }

    @keyframes spin{
      from{ transform: rotate(0deg); }
      to  { transform: rotate(360deg); }
    }

    /* Mobile : un peu plus petit pour pas bouffer la bannière */
    @media (max-width: 768px){
      .top-banner{ height: 44px; }
      .banner-track{ height: 44px; animation-duration: 22s; }
      .banner-candy{ width: 42px; height: 42px; }
      .banner-text{ font-size: 13px; }
    }
    /* ========================================================================== */

    nav{ margin: 12px 0 18px; }

    nav a{
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      margin: 0 8px;
      font-size: 0.9rem;
    }
    nav a:hover{ text-decoration: underline; }

    .logo{
      width: 320px;
      max-width: 90%;
      margin: 0 auto 18px;
      display: block;
    }
    @media (max-width: 520px){
      .logo{ width: 220px; }
    }

    .container{ width: min(1120px, 92vw); margin: 0 auto; }

    header{ padding: 92px 0 34px; text-align:center; }

    h1{
      margin:0 0 12px;
      font-size: clamp(2.2rem, 4vw, 3.2rem);
      letter-spacing: 0.5px;
    }

      margin: 0 auto;
      max-width: 920px;
