<!DOCTYPE html>
<html lang="fr">

  <style>
    body {
      margin: 0;

      );

    header {
      padding: 80px 20px;

    .cta {

  padding: 16px 42px;
  border: 1px solid rgba(255,255,255,0.8);
  color: #ffffff;
  text-decoration: none;
  font-size: 1.05rem;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  background: transparent;
  transition: all 0.3s ease;
}

  color: #000000;

}

  <section id="contact">

    <p>
